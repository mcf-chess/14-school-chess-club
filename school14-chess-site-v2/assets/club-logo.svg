<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">14 дүгээр сургуулийн шатрын клуб</title>
  <desc id="desc">Цэнхэр дугуй дэвсгэр дээр шар тойрог, цагаан морь, 14 дугаар.</desc>
  <!-- School colours: royal blue, yellow and white. -->
  <circle cx="80" cy="80" r="78" fill="#fff"/>
  <circle cx="80" cy="80" r="73" fill="#244de9"/>
  <circle cx="80" cy="80" r="64" fill="none" stroke="#f6db48" stroke-width="2"/>
  <!-- Two intersecting orbits echo the school's emblem. -->
  <g fill="none" stroke="#f6db48" stroke-width="3" opacity=".85">
    <ellipse cx="80" cy="74" rx="52" ry="27" transform="rotate(-44 80 74)"/>
    <ellipse cx="80" cy="74" rx="52" ry="27" transform="rotate(44 80 74)"/>
  </g>
  <!-- A geometric knight: mane, head and a stable chess-piece base. -->
  <path d="M52 112c0-17 7-28 21-41l-14 4-13-9 17-22 1-16 14 12c23 2 38 24 33 47l-4 25Z" fill="#fff" stroke="#244de9" stroke-width="4" stroke-linejoin="round"/>
  <path d="M83 48c17 9 21 28 13 45" fill="none" stroke="#f6db48" stroke-width="5" stroke-linecap="round"/>
  <circle cx="72" cy="54" r="3" fill="#244de9"/>
  <path d="m49 65 12-1" stroke="#244de9" stroke-width="3" stroke-linecap="round"/>
  <path d="M49 109h62v9H49z" fill="#fff" stroke="#244de9" stroke-width="3" stroke-linejoin="round"/>
  <rect x="58" y="119" width="44" height="28" rx="14" fill="#244de9"/>
  <text x="80" y="140" fill="#f6db48" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700">14</text>
</svg>
